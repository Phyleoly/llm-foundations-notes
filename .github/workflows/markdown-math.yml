name: Markdown math

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check Markdown math
        run: python scripts/check_markdown_math.py .
